title: My Blog
markdown: kramdown
kramdown:
  hard_wrap: true
url: "https://dinixuse.github.io/"
baseurl: "/jekyll-theme-material-you-enriched"

# for atom feed
author:
  name: Your Name
  email: your.email@example.com

plugins:
  - jemoji
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

collections_dir: all_collections
collections:
  posts:
    output: true

defaults:
  - scope:
      path: "_posts"
    values:
      layout: "post"
      permalink: /posts/:title/
exclude: ["sitemap.xml", "feed.xml", "LICENSE", "README.md"]
