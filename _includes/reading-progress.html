<div id="reading-progress" class="reading-progress" data-position="top-right">
  <button id="progress-toggle" class="progress-toggle" aria-label="展开/收起阅读进度" aria-expanded="true">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2L2 7L12 12L22 7L12 2Z"></path>
      <path d="M2 17L12 22L22 17"></path>
      <path d="M2 12L12 17L22 12"></path>
    </svg>
  </button>
  
  <div id="progress-content" class="progress-content">
    <div class="progress-header">
      <h3>文章目录</h3>
      <span id="progress-percentage" class="progress-percentage">0%</span>
    </div>
    
    <div id="progress-list" class="progress-list">
      <!-- 目录项将通过 JavaScript 动态生成 -->
    </div>
  </div>
</div>
