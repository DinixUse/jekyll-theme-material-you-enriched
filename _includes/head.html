<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{site.title}} | {{page.title}}</title>
  <link rel="icon" href="{{site.baseurl}}/favicon.ico" type="image/x-icon" />
  {% if page.layout == "post" %}
  <link rel="stylesheet" href="{{site.baseurl}}/assets/css/main.css" />
  <link rel="stylesheet" href="{{site.baseurl}}/assets/css/post.css" />
  <link rel="stylesheet" href="{{site.baseurl}}/assets/css/syntax.css" />
  {% if site.reading_progress.enabled %}
  <link rel="stylesheet" href="{{site.baseurl}}/assets/css/reading-progress.css" />
  {% endif %}
  {% else %}
  <link rel="stylesheet" href="{{site.baseurl}}/assets/css/main.css" />
  {% endif %}
  <link rel="stylesheet" href="{{site.baseurl}}/assets/css/common.css" />
  <script src="{{site.baseurl}}/assets/js/categories.js"></script>
  <script defer src="{{site.baseurl}}/assets/js/sidebar.js"></script>
  {% if page.layout == "post" %}
  <script defer src="{{site.baseurl}}/assets/js/lbox.js"></script>
  {% if site.reading_progress.enabled %}
  <script defer src="{{site.baseurl}}/assets/js/reading-progress.js"></script>
  <script>
    window.siteConfig = {
      reading_progress: {{ site.reading_progress | jsonify }}
    };
  </script>
  {% endif %}
  {% endif %}
</head>
